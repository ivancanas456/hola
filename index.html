<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula 1 - Pasión por la Velocidad</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
             border-radius: 4px;
        }
    </style>
</head>
<body class="bg-[#0f0f13] text-white selection:bg-f1red selection:text-white">

    <!-- Header & Navigation -->
    <header class="sticky top-0 z-50 bg-f1dark/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center space-x-3">
                <div class="bg-f1red px-3 py-1.5 rounded font-black text-2xl tracking-tighter italic shadow-lg shadow-f1red/30">
                    F1
                </div>
                <span class="font-bold tracking-wider text-lg hidden sm:inline">VELOCIDAD MÁXIMA</span>
            </div>

            <!-- Navigation Links -->
            <nav class="hidden md:flex space-x-8 font-semibold text-sm tracking-wide">
                <a href="#inicio" class="hover:text-f1red transition-colors">INICIO</a>
                <a href="#audio-section" class="hover:text-f1red transition-colors">AUDIO</a>
                <a href="#video-section" class="hover:text-f1red transition-colors">VÍDEO</a>
                <a href="#figure-section" class="hover:text-f1red transition-colors">MONOPLAZA</a>
                <a href="#map-section" class="hover:text-f1red transition-colors">CIRCUITO</a>
            </nav>

            <!-- Call to Action button -->
            <a href="#video-section" class="bg-f1red hover:bg-red-700 text-white px-5 py-2 rounded-full font-bold text-sm tracking-wider transition-all transform hover:scale-105 shadow-md shadow-f1red/20">
                VER CARRERA
            </a>
        </div>
    </header>

    <!-- Hero Section -->
    <section id="inicio" class="relative bg-gradient-to-b from-f1dark to-[#0f0f13] py-24 px-4 overflow-hidden border-b border-gray-800">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#e10600_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <div class="max-w-5xl mx-auto text-center relative z-10">
            <span class="bg-f1red/10 text-f1red font-semibold text-xs uppercase px-3 py-1 rounded-full border border-f1red/30 tracking-widest inline-block mb-4">
                Temporada Oficial
            </span>
            <h1 class="text-4xl sm:text-6xl lg:text-7xl font-black uppercase tracking-tight mb-6">
                Siente la Adrenalina de la <span class="text-f1red italic">Fórmula 1</span>
            </h1>
            <p class="text-f1gray text-lg sm:text-xl max-w-2xl mx-auto mb-10 leading-relaxed">
                Explora la máxima categoría del automovilismo mundial a través de contenido multimedia inmersivo: sonido de motores, momentos históricos, ingeniería de vanguardia y circuitos legendarios.
            </p>
            <div class="flex flex-wrap justify-center gap-4">
                <a href="#audio-section" class="bg-f1red hover:bg-red-700 text-white font-bold px-8 py-3.5 rounded-lg transition-all shadow-lg shadow-f1red/30 flex items-center gap-2">
                    <span>🎧 Escuchar Motor</span>
                </a>
                <a href="#figure-section" class="bg-f1card hover:bg-gray-800 text-white border border-gray-700 font-bold px-8 py-3.5 rounded-lg transition-all">
                    Ver Monoplaza
                </a>
            </div>
        </div>
    </section>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 space-y-24">

        <!-- 1. Etiqueta AUDIO -->
        <section id="audio-section" class="bg-f1card border border-gray-800 rounded-2xl p-6 sm:p-10 shadow-xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-f1red/5 rounded-full blur-3xl pointer-events-none"></div>
            <div class="max-w-3xl">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-3 h-8 bg-f1red rounded-full"></div>
                    <span class="text-f1red font-bold text-sm uppercase tracking-widest">Experiencia Sonora</span>
                </div>
                <h2 class="text-2xl sm:text-4xl font-black mb-4 uppercase">El Rugido del V6 Híbrido</h2>
                <p class="text-f1gray mb-8 leading-relaxed">
                    Siente la potencia de los motores actuales. Utiliza los controles de reproducción integrados para escuchar el característico sonido de aceleración máxima en recta principal.
                </p>

                <!-- Etiqueta <audio> estilizada -->
                <div class="bg-black/40 border border-gray-800 rounded-xl p-6 backdrop-blur-sm">
                    <div class="flex items-center justify-between mb-4">
                        <span class="font-semibold text-sm flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-green-500 animate-ping"></span>
                            Audio Oficial F1 V6 Turbo
                        </span>
                        <span class="text-xs text-f1gray font-mono">1.6L V6 + MGU-K</span>
                    </div>
                    <!-- Audio Tag Required -->
                    <audio controls class="w-full filter invert hue-rotate-180 opacity-90 rounded">
                        <source src="https://actions.google.com/sounds/v1/vehicles/formula_one_car_passing.ogg" type="audio/ogg">
                        <source src="https://actions.google.com/sounds/v1/vehicles            f1red: '#e10600',
                        f1dark: '#15151e',
                        f1card: '#1f1f2b',
                        f1gray: '#949498'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f13;
            color: #ffffff;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #15151e;
        }
        ::-webkit-scrollbar-thumb {
            background: #e10600;
           /formula_one_car_passing.ogg" type="audio/mpeg">
                        Tu navegador no soporta el elemento de audio.
                    </audio>
                </div>
            </div>
        </section>

        <!-- 2. Etiqueta VÍDEO -->
        <section id="video-section" class="bg-f1card border border-gray-800 rounded-2xl p-6 sm:p-10 shadow-xl">
            <div class="max-w-4xl mx-auto">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-3 h-8 bg-f1red rounded-full"></div>
                    <span class="text-f1red font-bold text-sm uppercase tracking-widest">Acción en Pista</span>
                </div>
                <h2 class="text-2xl sm:text-4xl font-black mb-4 uppercase">Emoción en el Gran Premio</h2>
                <p class="text-f1gray mb-8 leading-relaxed">
                    Disfruta de un video dinámico que captura la velocidad extrema y la competitividad rueda a rueda típica de una carrera de Fórmula 1.
                </p>

                <!-- Etiqueta <video> responsiva -->
                <div class="relative w-full overflow-hidden rounded-xl border border-gray-800 shadow-2xl bg-black aspect-video">
                    <!-- Video Tag Required -->
                    <video controls poster="https://placehold.co/1280x720/15151e/e10600?text=F1+Race+Action" class="w-full h-full object-cover">
                        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" type="video/mp4">
                        Tu navegador no soporta la etiqueta de vídeo.
                    </video>
                </div>
            </div>
        </section>

        <!-- 3. Etiqueta FIGURE (Piloto, Monoplaza o Circuito) -->
        <section id="figure-section" class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-center">
            <div>
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-3 h-8 bg-f1red rounded-full"></div>
                    <span class="text-f1red font-bold text-sm uppercase tracking-widest">Ingeniería de Vanguardia</span>
                </div>
                <h2 class="text-2xl sm:text-4xl font-black mb-4 uppercase">Monoplaza de Alta Competición</h2>
                <p class="text-f1gray mb-6 leading-relaxed">
                    Cada monoplaza es una obra maestra de la aerodinámica y la ciencia de materiales. La fibra de carbono, los alerones ajustables y los neumáticos Pirelli trabajan en conjunto para generar cargas aerodinámicas descomunales.
                </p>
                <ul class="space-y-3 text-sm text-f1gray mb-6">
                    <li class="flex items-center gap-2">✓ Chasis monocasco de fibra de carbono y nido de abeja de aluminio.</li>
                    <li class="flex items-center gap-2">✓ Potencia estimada superior a los 1,000 caballos de fuerza.</li>
                    <li class="flex items-center gap-2">✓ Velocidades punta que superan los 350 km/h en rectas largas.</li>
                </ul>
            </div>

            <!-- Etiqueta <figure> Requerida -->
            <figure class="bg-f1card border border-gray-800 rounded-2xl overflow-hidden shadow-2xl group">
                <div class="overflow-hidden aspect-video relative">
                    <img src="https://placehold.co/800x450/15151e/ffffff?text=F1+Monoplaza+Aerodinamica" 
                         onerror="this.src='https://placehold.co/800x450/15151e/e10600?text=Monoplaza+F1'"
                         alt="Monoplaza de Fórmula 1 en circuito" 
                         class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <div class="absolute top-4 right-4 bg-f1red text-white text-xs font-bold px-3 py-1 rounded shadow">
                        ESPECIFICACIÓN TÉCNICA
                    </div>
                </div>
                <figcaption class="p-6 bg-f1card">
                    <h3 class="font-bold text-lg mb-2 text-white">Monoplaza F1 - Configuración Aerodinámica de Baja Carga</h3>
                    <p class="text-f1gray text-sm leading-relaxed">
                        Fotografía de muestra de un bólido optimizado para minimizar la resistencia al avance (drag) y maximizar la velocidad máxima en circuitos rápidos.
                    </p>
                </figcaption>
            </figure>
        </section>

        <!-- 4. Etiqueta IFRAME (Contenido Externo / Mapa de Circuito) -->
        <section id="map-section" class="bg-f1card border border-gray-800 rounded-2xl p-6 sm:p-10 shadow-xl">
            <div class="max-w-4xl mx-auto">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-3 h-8 bg-f1red rounded-full"></div>
                    <span class="text-f1red font-bold text-sm uppercase tracking-widest">Ubicación Emblemática</span>
                </div>
                <h2 class="text-2xl sm:text-4xl font-black mb-4 uppercase">Circuito Legendario (Silverstone)</h2>
                <p class="text-f1gray mb-8 leading-relaxed">
                    A través de contenido incrustado mediante un marco flotante, puedes explorar la geografía real de uno de los circuitos históricos donde nació la Fórmula 1 en 1950.
                </p>

                <!-- Etiqueta <iframe> Requerida -->
                <div class="relative w-full h-[400px] rounded-xl overflow-hidden border border-gray-800 shadow-2xl">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d9715.421112461877!2d-1.0197227!3d52.0733333!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x487702f232408c51%3A0x62957cd730626a57!2sSilverstone%20Circuit!5e0!3m2!1ses!2ses!4v1650000000000!5m2!1ses!2ses" 
                        width="100%" 
                        height="100%" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade"
                        title="Mapa del Circuito de Silverstone"
                        class="w-full h-full filter contrast-125 invert-[90%] hue-rotate-180">
                    </iframe>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-f1dark border-t border-gray-800 py-12 text-center text-f1gray text-sm">
        <div class="max-w-7xl mx-auto px-4 space-y-4">
            <div class="flex items-center justify-center space-x-2">
                <div class="bg-f1red px-2 py-1 rounded font-black text-lg italic text-white">F1</div>
                <span class="font-bold text-white tracking-wider">PASIÓN POR LA VELOCIDAD</span>
            </div>
            <p>Página web desarrollada con fines educativos cumpliendo los requerimientos de etiquetas HTML avanzadas (&lt;audio&gt;, &lt;video&gt;, &lt;figure&gt;, &lt;iframe&gt;).</p>
            <p class="text-xs text-gray-600">&copy; 2026 Fórmula 1 Experience. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>
</html>
